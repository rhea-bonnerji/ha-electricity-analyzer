<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 512" width="1400" height="512">
  <g transform="translate(0,0)">  <!-- Electricity Analyzer: a day/night tile (the two meter registers), the bolt crossing
       from day into night, and the analysis rising on the night side. -->
  <defs>
    <linearGradient id="daylight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="0.55" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="nightlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <clipPath id="tilelight"><rect x="24" y="24" width="464" height="464" rx="120"/></clipPath>
    <filter id="shadowlight" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F0A2E" flood-opacity="0.40"/>
    </filter>
  </defs>
  <g clip-path="url(#tilelight)">
    <rect x="0" y="0" width="512" height="512" fill="url(#nightlight)"/>
    <!-- day: the upper-left triangle, edged by a gentle curve like a horizon -->
    <path d="M0 0 H512 V40 C 380 150, 170 330, 40 512 H0 Z" fill="url(#daylight)"/>
    <!-- a faint glow along the horizon -->
    <path d="M512 40 C 380 150, 170 330, 40 512" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="6"/>
  </g>
  <!-- the analysis: rising bars on the night side -->
  <g fill="#FFFFFF" fill-opacity="0.5">
    <rect x="300" y="340" width="32" height="72" rx="9"/>
    <rect x="346" y="296" width="32" height="116" rx="9"/>
    <rect x="392" y="244" width="32" height="168" rx="9"/>
  </g>
  <!-- the bolt, crossing from day into night -->
  <path filter="url(#shadowlight)" fill="#FFFFFF"
        d="M282 64 L132 286 Q124 298 138 298 L232 298 L204 440 Q201 456 214 444 L384 214 Q392 202 378 202 L284 202 L312 78 Q316 58 282 64 Z"/></g>
  <text x="560" y="250" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="150" font-weight="600" letter-spacing="-2" fill="#111827">Electricity</text>
  <text x="564" y="408" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="150" font-weight="400" letter-spacing="-1" fill="#4B5563">Analyzer</text>
</svg>
